# ===================================================
# Sports EMS — Combined Backend
# ===================================================
server.port=${PORT:8080}
spring.application.name=sports-ems-combined

# ---------- MySQL ----------
# All three are read from Render's environment variables (Dashboard -> your
# service -> Environment). Nothing sensitive is hardcoded here anymore.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------- Jackson ----------
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Email (Resend HTTP API) ----------
# Render's free tier blocks outbound SMTP, so we send email via Resend's
# HTTPS API instead. Get an API key at https://resend.com (free tier: 3,000
# emails/month) and set RESEND_API_KEY as an environment variable on Render.
resend.api-key=${RESEND_API_KEY:}

# Set to false to disable emails entirely
app.email.enabled=true
# Until you verify your own domain on Resend, this MUST stay onboarding@resend.dev
# (Resend's sandbox sender) — and emails will only deliver to the address you
# signed up to Resend with. Once you verify a domain, change this to
# something like noreply@yourdomain.com to email real users.
app.email.from=onboarding@resend.dev
server.error.include-message=always

# ---------- Google Sign-In ----------
# Create an OAuth 2.0 Client ID (Web application) at:
# https://console.cloud.google.com/apis/credentials
# and paste it here AND in frontend/.env as VITE_GOOGLE_CLIENT_ID.
# Used to verify that Google ID tokens were issued for THIS app.
google.oauth.client-id=${GOOGLE_CLIENT_ID}

# ---------- JWT ----------
# Set JWT_SECRET in Render's environment variables to a long random string,
# e.g. generate one with: openssl rand -base64 48
jwt.secret=${JWT_SECRET:sportsemssecretkey123456789sportsemssecretkey123456789}

server.error.include-message=always
